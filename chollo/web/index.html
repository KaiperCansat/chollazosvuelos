<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chollo Vuelos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#e7eef5;--card:#fff;--tx:#0b1f33;--mu:#5c6f82;--bd:#cfdae5;--ac:#0b1f33;--on:#ffc933;--red:#d7263d;--gr:#0e8a5f}
@media(prefers-color-scheme:dark){:root{--bg:#08111d;--card:#11233a;--tx:#eef4fa;--mu:#8fa5ba;--bd:#233a55;--ac:#ffc933;--on:#0b1f33;--red:#ff6b7d;--gr:#3ddc9f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{max-width:480px;margin:auto;padding:16px 14px 40px}h1{font-size:26px;margin:0 0 8px}h2{font-size:18px;margin:20px 0 8px}
.mu{color:var(--mu);font-size:13px}select,input{font:inherit;width:100%;padding:10px;margin:4px 0 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 14px;background:var(--ac);color:var(--on);cursor:pointer;width:100%}
.btn.o{background:none;color:var(--tx);border:1.5px solid var(--bd);width:auto;padding:8px 12px}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.tabs .on{outline:2px solid var(--on)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;text-align:center}
.now{font-size:52px;font-weight:800;line-height:1}.old{color:var(--red);text-decoration:line-through;font-weight:700;font-size:20px}.sv{color:var(--gr);font-weight:700;margin:4px 0}
.al{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
a.btn{display:block;text-decoration:none;text-align:center;margin-top:8px}
</style></head><body><div id="app"></div>
<script>
const SUPABASE_URL="PEGA_AQUI_TU_PROJECT_URL", SUPABASE_ANON_KEY="PEGA_AQUI_TU_ANON_KEY"; // la anon key es pública; la protegen las reglas RLS
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const N={BCN:"Barcelona",GRO:"Girona",MAD:"Madrid",MXP:"Milán",FCO:"Roma",CDG:"París",LHR:"Londres",LIS:"Lisboa",BER:"Berlín",AMS:"Ámsterdam",BRU:"Bruselas"};
const $=s=>document.querySelector(s),nm=c=>N[c]||c;
let tab="o",msg="";
const opts=(l,any)=>(any?`<option value="ANY">Cualquier lugar</option>`:"")+l.map(c=>`<option value="${c}">${N[c]}</option>`).join("");
function card(x){return `<div class="card"><b>${nm(x.origin)} → ${nm(x.dest)}</b><div class="mu">${x.airline||""} · 📅 ${x.dep_date}${x.ret_date?" → "+x.ret_date:""}</div><div class="now">${Math.round(x.price)} €</div><div class="old">${Math.round(x.usual)} €</div><div class="sv">−${x.pct} % · Ahorras ${Math.round(x.usual-x.price)} €</div><a class="btn" href="${x.link||"#"}" target="_blank" rel="noopener">Ver vuelo →</a></div>`}
async function login(){const email=$("#em").value.trim();if(!email)return;const{error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});msg=error?"Error: "+error.message:"Te hemos enviado un enlace a "+email+". Ábrelo desde este mismo dispositivo.";show()}
async function show(){
 const{data:{session}}=await db.auth.getSession(),A=$("#app");
 if(!session){A.innerHTML=`<h1>✈️ Chollo Vuelos</h1><p>Entra con tu correo para crear alertas y recibir los chollos. Sin contraseña: te mandamos un enlace.</p><input id="em" type="email" placeholder="tu@correo.com" autocomplete="email"><button class="btn" onclick="login()">Enviarme el enlace</button><p class="mu">${msg}</p>`;return}
 let body="";
 if(tab=="o"){const{data,error}=await db.from("deals").select("*").gte("pct",20).order("pct",{ascending:false}).limit(40);
  body=error?`<p class="mu">${error.message}</p>`:data.length?data.map(card).join(""):`<p class="mu">Aún no hay ofertas. Crea una alerta y espera a la primera revisión de precios.</p>`}
 else{const{data}=await db.from("alerts").select("*").order("created_at",{ascending:false});
  body=`<h2>Nueva alerta</h2>Origen<select id="o">${opts(["BCN","GRO","MAD"])}</select>Destino<select id="d">${opts(Object.keys(N).slice(3),1)}</select>
Precio máximo (€)<input id="p" type="number" value="50">Tipo<select id="t"><option value="rt">Ida y vuelta</option><option value="ow">Solo ida</option><option value="any">Cualquiera</option></select>
Descuento mínimo<select id="m"><option>20</option><option selected>40</option><option>60</option></select><button class="btn" onclick="addAlert()">Crear alerta</button>
<h2>Tus alertas</h2>${(data||[]).map(a=>`<div class="al"><div><b>${nm(a.origin)} → ${a.dest=="ANY"?"Cualquier lugar":nm(a.dest)}</b><div class="mu">Hasta ${a.max_price} € · −${a.min_discount} %</div></div><button class="btn o" onclick="delAlert('${a.id}')">Borrar</button></div>`).join("")||`<p class="mu">Aún no tienes alertas.</p>`}`}
 A.innerHTML=`<h1>✈️ Chollo Vuelos</h1><div class="mu">${session.user.email} · <a href="#" onclick="db.auth.signOut().then(show);return false">Salir</a></div>
<div class="tabs"><button class="btn o ${tab=="o"?"on":""}" onclick="tab='o';show()">🔥 Ofertas</button><button class="btn o ${tab=="a"?"on":""}" onclick="tab='a';show()">🔔 Alertas</button></div>${body}`}
async function addAlert(){const{error}=await db.from("alerts").insert({origin:$("#o").value,dest:$("#d").value,max_price:+$("#p").value||50,trip:$("#t").value,min_discount:+$("#m").value});if(error)alert(error.message);show()}
async function delAlert(id){await db.from("alerts").delete().eq("id",id);show()}
db.auth.onAuthStateChange(()=>show());show();
</script></body></html>
